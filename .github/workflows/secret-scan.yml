name: Secret Scan

# SEC-11: the repo had CODEOWNERS and Dependabot but no automated secret
# detection gate. This runs gitleaks against the diff on PRs (fast) and a
# full-history scan on a weekly schedule (catches anything already merged).
# It reports findings; it does not rewrite history — that stays a manual,
# coordinated step (see SEC-01/SEC-14 remediation notes).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
