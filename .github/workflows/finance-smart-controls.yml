name: Finance Smart Controls

on:
  push:
    branches:
      - "feat/finance-budget-grn-vendor-flow"
  pull_request:
    branches: [main]
    paths:
      - "src/pages/finance/**"
      - "src/components/finance/**"
      - "src/hooks/useBranchBudget.ts"
      - "src/hooks/useBudgetCoverage.ts"
      - "src/hooks/useProcessLobPnl.ts"
      - "backend/src/modules/finance/**"
      - "backend/src/modules/process-pnl/**"
      - "backend/src/services/notification.service.ts"
      - "backend/src/db/runFinance**"
      - "backend/src/db/runPendingMigrations.ts"
      - "backend/sql/41*.sql"
      - "backend/sql/420*.sql"
      - "backend/sql/421*.sql"
      - "backend/sql/422*.sql"
      - "backend/sql/423*.sql"
      - ".github/workflows/finance-smart-controls.yml"

permissions:
  contents: read

concurrency:
  group: finance-smart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: hrms_finance_ci
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
      JWT_SECRET: finance-ci-placeholder-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Frontend typecheck
        shell: bash
        run: |
          set -o pipefail
          if ! npm run typecheck > /tmp/frontend-typecheck.log 2>&1; then
            tail -n 120 /tmp/frontend-typecheck.log
            exit 1
          fi

      - name: Backend typecheck
        id: backend-typecheck
        shell: bash
        run: |
          set -o pipefail
          if ! npm --prefix backend run typecheck > /tmp/backend-typecheck.log 2>&1; then
            tail -n 160 /tmp/backend-typecheck.log
            exit 1
          fi

      - name: Upload backend typecheck diagnostics
        if: failure() && steps.backend-typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: backend-typecheck-diagnostics
          path: /tmp/backend-typecheck.log
          if-no-files-found: error
          retention-days: 3

      - name: Finance calculations and contracts
        id: finance-tests
        shell: bash
        working-directory: backend
        run: |
          set -o pipefail
          if ! npm test -- --run \
            src/modules/process-pnl/__tests__/branch-budget.calculation.test.ts \
            src/modules/process-pnl/__tests__/bpo-pnl.calculation.test.ts \
            src/modules/process-pnl/__tests__/bpo-pnl.schema-contract.test.ts \
            src/modules/process-pnl/__tests__/process-lob.test.ts \
            src/modules/process-pnl/__tests__/process-lob-mysql.integration.test.ts \
            src/modules/process-pnl/__tests__/pnl-master-ui.contract.test.ts \
            src/modules/finance/__tests__/finance.schema-contract.test.ts \
            src/modules/finance/__tests__/budget-coverage.contract.test.ts \
            src/modules/finance/__tests__/grn-validation-override.contract.test.ts \
            src/modules/finance/__tests__/grn-validation-schema-hardening.contract.test.ts \
            > /tmp/finance-tests.log 2>&1; then
            tail -n 240 /tmp/finance-tests.log
            exit 1
          fi
          cat /tmp/finance-tests.log

      - name: Upload finance test diagnostics
        if: failure() && steps.finance-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: finance-test-diagnostics
          path: /tmp/finance-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Frontend build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Backend build
        run: npm --prefix backend run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
