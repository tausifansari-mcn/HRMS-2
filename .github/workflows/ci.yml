name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub runners are UTC; this platform is an IST business and the PM2 apps now pin
# TZ=Asia/Kolkata, so CI ran in a timezone production does not use. That is not a
# theoretical mismatch — it made seven tests pass locally and fail here, and the diagnosis
# cost real time because the job names implicated the code rather than the clock:
#
#   composeIstDateTime  tagged every APR datetime one day early on a UTC host
#   running-salary      dropped the month's last day on an IST host (opposite direction)
#
# Both are now timezone-independent, but CI should still exercise the timezone production
# runs in. Note the trade-off: with this pinned, a NEW host-timezone dependency will pass
# CI. The defence against that is writing date logic that does not read a local Date back
# as UTC, not a UTC runner that happens to catch one direction of the mistake.
env:
  TZ: Asia/Kolkata

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint changed JavaScript and TypeScript files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            range="origin/$GITHUB_BASE_REF...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git fetch origin "$before" --depth=1 || true
              range="$before..HEAD"
            else
              range="HEAD^..HEAD"
            fi
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$range" |
              grep -E '\.(cjs|js|jsx|mjs|ts|tsx)$' || true
          )

          lint_files=()
          for file in "${changed_files[@]}"; do
            if [ -f "$file" ]; then
              lint_files+=("$file")
            fi
          done

          if [ "${#lint_files[@]}" -eq 0 ]; then
            echo "No changed JavaScript or TypeScript files require linting."
            exit 0
          fi

          printf 'Linting %s changed files:\n' "${#lint_files[@]}"
          printf ' - %s\n' "${lint_files[@]}"
          npx eslint "${lint_files[@]}"

  # On 31 July 2026 five commits removed merged work from main while describing
  # something else. 9cb198b2 — "fix(budget): normalise copy-forward key" —
  # contained no budget file and deleted four test suites and four SQL
  # migrations. Branch protection does not catch this: these are ordinary
  # pushes, not force-pushes. Several sessions share one working tree, so
  # staging a file by explicit path commits whatever that file says on disk, and
  # a stale copy silently reverts whoever changed it since.
  #
  # Deleting a test or a migration is sometimes right, so this does not forbid
  # it — it requires the commit to say so, with [allow-deletions].
  deletion-guard:
    name: Deletion Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refuse silent deletion of tests, migrations and workflows
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            range="origin/$GITHUB_BASE_REF...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git fetch origin "$before" --depth=1 || true
              range="$before..HEAD"
            else
              range="HEAD^..HEAD"
            fi
          fi
          node scripts/guard-mass-deletion.mjs "$range"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsconfig.app.json declares types: ["vite/client", "./backend/node_modules/vitest/globals"].
      # Installing only the root left that path missing, so this job failed every run with
      # TS2688 "Cannot find type definition file for './backend/node_modules/vitest/globals'"
      # — an environment fault, not a code fault. It made the gate useless (a real type error
      # was indistinguishable from the permanent one) and, because `build` declares
      # needs: [typecheck], the Build job was SKIPPED on every run, so nothing verified that
      # the frontend still builds. frontend-tests and finance-validation already install both.
      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  security-tests:
    name: Security and RBAC Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Authentication security contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/modules/auth/__tests__/auth-security.test.ts) && exit 0
            echo "Authentication security contract attempt $attempt failed."
          done
          exit 1

      - name: Document vault security contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/modules/files/__tests__/document-vault-security.test.ts) && exit 0
            echo "Document vault security contract attempt $attempt failed."
          done
          exit 1

      - name: Migration governance contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/db/__tests__/migration-governance.test.ts) && exit 0
            echo "Migration governance contract attempt $attempt failed."
          done
          exit 1

      # A manifest entry that silently disappears means that migration never runs
      # on a fresh database, and nothing fails at the time. On 2026-08-02 a stale
      # working copy removed three entries this way; the staged deletion count was
      # visible and was rationalised away. This makes that impossible to repeat.
      - name: Migration manifest guard
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/db/__tests__/migration-manifest-guard.test.ts) && exit 0
            echo "Migration manifest guard attempt $attempt failed."
          done
          exit 1

      # MariaDB-only `ADD COLUMN IF NOT EXISTS` / `ADD INDEX IF NOT EXISTS` syntax is
      # rejected by this production MySQL 8.0.42 build with ER_PARSE_ERROR — the exact
      # cause of the 2026-08-13 outage (~24 min) on migration 1006. The test existed
      # before that incident (scoped to migration 225) but was never generalized to run
      # against every migration in CI, so it caught nothing for 1006. Static, no DB
      # needed — this is the earliest possible gate, well before a deploy.
      - name: Migration syntax compatibility (MySQL 8)
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/db/__tests__/migration-syntax-compatibility.test.ts) && exit 0
            echo "Migration syntax compatibility attempt $attempt failed."
          done
          exit 1

      # A migration whose INSERT/UPDATE/ALTER TABLE targets a table that does not
      # exist (and that the same file does not create) raises ER_NO_SUCH_TABLE at
      # boot — the cause of the 2026-08-14 outage (~11 min) on migration 1007, which
      # wrote to workforce_page_catalog/workforce_role_page_permissions when the real
      # tables are page_catalog/role_page_access. This only tests the pure parsing
      # logic (no DB) — the live information_schema check runs at deploy time via
      # `npm run preflight`, see migration-target-table-check.ts.
      - name: Migration target-table parsing
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run scripts/__tests__/migration-target-table-check.test.ts) && exit 0
            echo "Migration target-table parsing attempt $attempt failed."
          done
          exit 1

      # Catches a client calling an API path no router serves. Three such bugs
      # reached production in one week and none was findable by probing, because
      # requireAuth on the bare /api prefix makes a missing route 401 like a real
      # one. Reads frontend source straight from the checkout (no root npm ci
      # needed) and enumerates the routes in-process from the Express app.
      - name: API route contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/platform/__tests__/route-contract.test.ts) && exit 0
            echo "API route contract attempt $attempt failed."
          done
          exit 1

      - name: Database connection reliability contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/db/__tests__/connection-reliability.test.ts) && exit 0
            echo "Database connection reliability contract attempt $attempt failed."
          done
          exit 1

      - name: Worker safety contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/workers/__tests__/worker-safety.test.ts) && exit 0
            echo "Worker safety contract attempt $attempt failed."
          done
          exit 1

      # Fails when a query names a column mas_hrms does not have. That query throws at
      # runtime, and the .catch() around it turns the error into a fabricated zero that
      # renders as a real measurement — the most common defect in this repo. Ratcheted
      # against a baseline of the 189 refs that already existed, so it only fails on new
      # ones. Offline: validates against backend/sql/schema-snapshot.json, no DB needed.
      - name: Schema column reference contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/db/__tests__/schema-column-refs.test.ts) && exit 0
            echo "Schema column reference contract attempt $attempt failed."
          done
          exit 1

      # Every test below caught a defect that reached main on 2026-07-31, when four
      # commits' worth of work was silently reverted by unrelated commits made from a
      # stale working tree. Each one fails against the reverted code, so CI would have
      # blocked those pushes had it been running them.
      #
      # They are listed individually rather than as `vitest run backend/tests` on
      # purpose: that directory currently has 105 failing tests across 32 files, so a
      # blanket run would make CI permanently red and therefore ignored. Move files up
      # into this list as they are fixed.
      - name: Payroll multi-run recalculation contract
        shell: bash
        run: |
          # salary_prep_run's UNIQUE (run_month, branch_filter, process_filter) does not
          # prevent duplicates — both filter columns are nullable and MySQL treats NULLs
          # as distinct. 2026-07 holds two full-company runs with 1,288 employees sharing
          # a line in both, so recalculating only the newest leaves stale salary values.
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run tests/payroll-targeted-recalculation.test.ts) && exit 0
            echo "Payroll multi-run recalculation contract attempt $attempt failed."
          done
          exit 1

      - name: CEO UAT regression contracts
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run \
              src/modules/dashboards/__tests__/attendance-canon.contract.test.ts \
              src/modules/dashboards/__tests__/dashboard-summary-inbox-isolation.test.ts \
              src/modules/payroll/__tests__/payroll-signoff-schema-contract.test.ts \
              src/modules/payroll/__tests__/payroll-payslip-access.contract.test.ts \
              src/modules/access/__tests__/ceo-page-scope.contract.test.ts \
              src/modules/lms/__tests__/lms-launch-context-portal.contract.test.ts) && exit 0
            echo "CEO UAT regression contracts attempt $attempt failed."
          done
          exit 1

  full-suite:
    name: Backend suite (no new failures)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      # security-tests above names suites one by one. 297 backend test files exist
      # and only 19 were ever listed, so 278 could rot unnoticed — and one did: the
      # ATS assessment catalog test was never in CI and stayed red long enough to
      # hide a real regression, which silently downgraded every free-text hiring
      # answer from human review to keyword scoring.
      #
      # The objection to a blanket run recorded above is correct — the backlog
      # would make CI permanently red and therefore ignored. This runs everything
      # anyway but compares against a recorded baseline of the known failures, so
      # the backlog does not block the build while nothing NEW can break quietly.
      # It also fails when a baselined test starts passing, so the baseline
      # shrinks instead of becoming a list of stale excuses, and newly broken
      # files are re-run once before being reported so flake is not mistaken for
      # a regression.
      - name: Backend suite against known-failure baseline
        run: npm --prefix backend run test:baseline

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    # CI ran lint, typecheck and build for the frontend but never its test suite, so
    # nothing guarded 350 passing tests. A backend change that alters an API contract
    # the UI depends on — for example the work inbox gaining an "aged" risk level the
    # UI did not know about, which would have thrown on RISK_STYLES[task.risk] — was
    # invisible to CI.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Both installs are required and the job silently did nothing without the first.
      # vitest itself resolves from backend/node_modules, but vitest.config.ts line 1 is
      # `import react from "@vitejs/plugin-react-swc"` — a ROOT devDependency. Installing
      # only backend left that unresolvable, so every run died at config load with
      # ERR_MODULE_NOT_FOUND before executing a single test, on both attempts. The job
      # reported failure, nothing consumed that failure, and 378 frontend tests went
      # unguarded from the day this job was added.
      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Frontend test suite
        shell: bash
        run: |
          # Proves the config resolves before the retry loop. A config-load failure is a
          # CI defect, not a flaky test, and retrying it twice only hid that for a week.
          node backend/node_modules/vitest/vitest.mjs list --config vitest.config.ts > /dev/null \
            || { echo "::error::vitest.config.ts failed to load - frontend deps are not installed"; exit 1; }
          for attempt in 1 2; do
            node backend/node_modules/vitest/vitest.mjs run --config vitest.config.ts --testTimeout=60000 && exit 0
            echo "Frontend test suite attempt $attempt failed."
          done
          exit 1

  finance-validation:
    name: Finance API and schema contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      # working-directory is load-bearing. `npm --prefix backend exec` changes package
      # RESOLUTION, not the working directory, so vitest ran from the repo root and picked
      # up the ROOT config — whose include is src/**/*.{test,spec}.{ts,tsx} and whose
      # exclude list contains `backend`. The six paths below therefore matched nothing:
      #
      #   No test files found, exiting with code 1
      #
      # This job failed 12 of its last 15 runs on that alone. It is the gate over
      # branch-budget, BPO P&L, GRN validation-override and the finance schema contracts,
      # so the money calculations had NO passing gate — the step never executed a test.
      # The 55 tests themselves pass; only the invocation was wrong.
      - name: Finance calculation and schema-contract tests
        working-directory: backend
        run: >-
          npm exec -- vitest run
          src/modules/process-pnl/__tests__/branch-budget.calculation.test.ts
          src/modules/process-pnl/__tests__/bpo-pnl.calculation.test.ts
          src/modules/process-pnl/__tests__/bpo-pnl.schema-contract.test.ts
          src/modules/finance/__tests__/finance.schema-contract.test.ts
          src/modules/finance/__tests__/budget-coverage.contract.test.ts
          src/modules/finance/__tests__/grn-validation-override.contract.test.ts

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Build backend
        run: npm --prefix backend run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  finance-validation-report:
    name: Finance validation report
    if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'feat/')
    needs: [finance-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Update draft PR validation comment
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 10,
            });
            if (!pulls.data.length) {
              core.info(`No open pull request found for ${branch}`);
              return;
            }

            const pull = pulls.data[0];
            const result = '${{ needs.finance-validation.result }}';
            const marker = '<!-- finance-validation-status -->';
            const passed = result === 'success';
            const body = [
              marker,
              `## ${passed ? '✅' : '❌'} Finance validation ${passed ? 'passed' : 'failed'}`,
              '',
              `- Result: **${result}**`,
              `- Commit: \`${context.sha.slice(0, 12)}\``,
              `- Checks: frontend typecheck, backend typecheck, branch-budget/BPO P&L calculations, finance smart-GRN/coverage/override contracts, frontend build, backend build`,
              `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body,
              });
            }
