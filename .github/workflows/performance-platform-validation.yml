name: Performance Platform Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/sql/580_performance_ingestion_platform.sql"
      - "backend/sql/581_performance_multi_source_lineage.sql"
      - "backend/sql/582_performance_governance_audit.sql"
      - "backend/scripts/performance-manual-upload-verify.ts"
      - "backend/src/modules/performance-ingestion/**"
      - "backend/src/modules/performance-intelligence/**"
      - "backend/src/db/runPendingMigrations.ts"
      - "backend/src/server.ts"
      - "backend/src/workers/all-workers.ts"
      - "src/components/performance-hub/**"
      - "src/pages/PerformanceHub.tsx"
      - "src/types/performanceHub.ts"
      - "src/types/performanceIngestion.ts"
      - "src/types/performanceAudit.ts"
      - "docs/performance-ingestion-platform.md"
      - "docs/performance-scheduled-sync.md"
      - "docs/performance-governance-audit.md"
      - "docs/performance-manual-upload-certification.md"
      - ".github/workflows/performance-platform-validation.yml"
  push:
    branches:
      - codex/performance-platform-finalization
    paths:
      - "backend/sql/580_performance_ingestion_platform.sql"
      - "backend/sql/581_performance_multi_source_lineage.sql"
      - "backend/sql/582_performance_governance_audit.sql"
      - "backend/scripts/performance-manual-upload-verify.ts"
      - "backend/src/modules/performance-ingestion/**"
      - "backend/src/modules/performance-intelligence/**"
      - "backend/src/db/runPendingMigrations.ts"
      - "backend/src/server.ts"
      - "backend/src/workers/all-workers.ts"
      - "src/components/performance-hub/**"
      - "src/pages/PerformanceHub.tsx"
      - "src/types/performanceHub.ts"
      - "src/types/performanceIngestion.ts"
      - "src/types/performanceAudit.ts"
      - "docs/performance-ingestion-platform.md"
      - "docs/performance-scheduled-sync.md"
      - "docs/performance-governance-audit.md"
      - "docs/performance-manual-upload-certification.md"
      - ".github/workflows/performance-platform-validation.yml"

permissions:
  contents: read

concurrency:
  group: performance-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Performance platform tests
        working-directory: backend
        run: >-
          npm test -- --run
          src/modules/performance-ingestion/__tests__/performance-source-adapters.test.ts
          src/modules/performance-ingestion/__tests__/performance-governance.service.test.ts
          src/modules/performance-ingestion/__tests__/performance-scheduler.service.test.ts
          src/modules/performance-ingestion/__tests__/performance-manual-upload.service.test.ts
          src/modules/performance-ingestion/__tests__/performance-manual-upload-verification.service.test.ts
          src/modules/performance-intelligence/__tests__/performance-intelligence.formulas.test.ts
          src/modules/performance-intelligence/__tests__/performance-intelligence.service.test.ts
          src/config/__tests__/env-loading.contract.test.ts
          src/db/__tests__/migrate-fresh-test-safety.contract.test.ts

      - name: Authentication security contract
        working-directory: backend
        run: npm test -- --run src/modules/auth/__tests__/auth-security.test.ts

      - name: Document vault security contract
        working-directory: backend
        run: npm test -- --run src/modules/files/__tests__/document-vault-security.test.ts

      - name: Migration governance contract
        working-directory: backend
        run: npm test -- --run src/db/__tests__/migration-governance.test.ts

      - name: Database connection reliability contract
        working-directory: backend
        run: npm test -- --run src/db/__tests__/connection-reliability.test.ts

      - name: Worker safety contract
        working-directory: backend
        run: npm test -- --run src/workers/__tests__/worker-safety.test.ts

      - name: Backend build
        run: npm --prefix backend run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend production build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}
