# Email every candidate/employee whose verified bank account number was lost
# to two now-fixed write bugs, asking them to re-enter it.
#
# WHY THE SELF-HOSTED RUNNER
# SMTP credentials live only in the deploy host's .env, same reason as every
# other email-sending workflow in this repo.
#
# WHY MANUAL-ONLY
# Every confirmed run sends a real email to a real person about their bank
# details. Not something a schedule should decide on its own.

name: Bank Resubmit Request

on:
  workflow_dispatch:
    inputs:
      actor_user_id:
        description: "auth_user.id to attribute this remediation to (recorded in the audit trail; the script refuses to run without it)"
        required: true
        type: string
      mode:
        description: "list-only enumerates eligible people and sends nothing; confirm actually sends"
        required: true
        type: choice
        default: list-only
        options:
          - list-only
          - confirm
      candidate_id:
        description: "Optional: restrict the run to a single candidate id. Leave empty to sweep every eligible one."
        required: false
        type: string

concurrency:
  group: bank-resubmit-request
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    name: Send on 192.168.11.225
    runs-on: self-hosted
    environment: production
    timeout-minutes: 20

    steps:
      - name: Announce the run
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ACTOR_USER_ID: ${{ inputs.actor_user_id }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          echo "mode:          ${MODE}"
          echo "actor user:    ${ACTOR_USER_ID}"
          echo "candidate id:  ${CANDIDATE_ID:-<none — all eligible people>}"
          if [[ "${MODE}" == "confirm" ]]; then
            echo "SENDS:         YES — real emails will go out to real people."
          else
            echo "SENDS:         no — this only lists who is eligible."
          fi

      - name: Verify the deployed script exists
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="/var/www/HRMS2/backend/dist/scripts/request-bank-resubmit.js"
          if [[ ! -f "$SCRIPT" ]]; then
            echo "::error::$SCRIPT is missing."
            echo "This workflow runs the deployed build; it does not compile anything."
            echo "Run the 'Deploy to Production' workflow on main first, then re-run this."
            exit 1
          fi
          echo "Found $SCRIPT"

      - name: Run the send
        id: run
        shell: bash
        working-directory: /var/www/HRMS2/backend
        env:
          MODE: ${{ inputs.mode }}
          ACTOR_USER_ID: ${{ inputs.actor_user_id }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail

          mkdir -p logs
          REPORT="/var/www/HRMS2/backend/logs/bank-resubmit-request-$(date -u +%Y%m%dT%H%M%SZ)-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.csv"

          ARGS=(dist/scripts/request-bank-resubmit.js)
          ARGS+=(--actor-user-id "$ACTOR_USER_ID")
          if [[ -n "${CANDIDATE_ID// /}" ]]; then
            ARGS+=(--candidate-id "$CANDIDATE_ID")
          fi
          ARGS+=(--report "$REPORT")
          if [[ "$MODE" == "confirm" ]]; then
            ARGS+=(--confirm)
          fi

          echo "+ node ${ARGS[*]}"

          CODE=0
          node "${ARGS[@]}" || CODE=$?

          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "report_path=${REPORT}" >> "$GITHUB_OUTPUT"
          echo "Script exited ${CODE}; report at ${REPORT}"

      - name: Publish report to run summary
        if: always()
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          ACTOR_USER_ID: ${{ inputs.actor_user_id }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          REPORT_PATH: ${{ steps.run.outputs.report_path }}
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "## Bank resubmit request — ${MODE}"
            echo ""
            echo "- **Actor user id:** \`${ACTOR_USER_ID}\`"
            echo "- **Candidate filter:** ${CANDIDATE_ID:-_none — all eligible people_}"
            echo "- **Script exit code:** \`${EXIT_CODE:-<script did not run>}\`"
            echo "- **Report:** \`${REPORT_PATH:-<none>}\`"
            echo "- **Host:** 192.168.11.225"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${REPORT_PATH:-}" && -f "${REPORT_PATH}" && "${MODE}" == "confirm" ]]; then
            {
              echo "### Per-person report"
              echo ""
              echo '```csv'
              cat "${REPORT_PATH}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always() && inputs.mode == 'confirm'
        uses: actions/upload-artifact@v7
        with:
          name: bank-resubmit-request-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run.outputs.report_path }}
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if the script reported a failure
        if: always() && steps.run.outputs.exit_code != '0'
        shell: bash
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          REPORT_PATH: ${{ steps.run.outputs.report_path }}
        run: |
          set -euo pipefail
          echo "::error::Send exited ${EXIT_CODE} — at least one person was not sent."
          echo "Read the report for the per-person reason before re-running: ${REPORT_PATH:-<no report>}"
          exit 1
